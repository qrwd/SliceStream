[workspace]
members = [
  "crates/common",
  "crates/metering",
  "crates/fiber_rpc",
  "apps/providerd",
  "apps/agentd",
  "apps/dashboard",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
